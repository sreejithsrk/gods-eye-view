<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Requirements Intelligence</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 100vw;
        height: 56.25vw;
        max-height: 100vh;
        max-width: 177.78vh;
        display: block;
      }
      body.render #stage {
        width: 1920px;
        height: 1080px;
        max-width: none;
        max-height: none;
        inset: 0 auto auto 0;
        margin: 0;
      }
      body.render #ui {
        display: none;
      }
      #ui {
        position: fixed;
        left: 24px;
        right: 24px;
        bottom: 18px;
        opacity: 0;
        transition: opacity 0.3s;
        font:
          12px/1 ui-monospace,
          monospace;
        color: #9aa6c8;
      }
      #ui.show {
        opacity: 1;
      }
      #ui.hidden {
        display: none;
      }
      #scrub {
        position: relative;
        height: 18px;
        cursor: pointer;
      }
      #track {
        position: absolute;
        left: 0;
        right: 0;
        top: 8px;
        height: 2px;
        background: rgba(255, 255, 255, 0.15);
      }
      #fill {
        position: absolute;
        left: 0;
        top: 8px;
        height: 2px;
        background: #5cc8ff;
      }
      .mark {
        position: absolute;
        top: 4px;
        width: 2px;
        height: 10px;
        padding: 0;
        border: 0;
        background: rgba(255, 255, 255, 0.4);
        cursor: pointer;
      }
      #row {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1920" height="1080"></canvas>
    <div id="ui">
      <div id="scrub">
        <div id="track"></div>
        <div id="fill"></div>
        <div id="marks"></div>
      </div>
      <div id="row">
        <span id="clock"></span
        ><span>space play/pause · ←/→ 1s · shift+←/→ 1 frame · H hide</span>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
